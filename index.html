async function loadState(){
  const stored = localStorage.getItem('pyquestState');
  if(stored) try { state = JSON.parse(stored); } catch(e) { console.error("Failed to load state:", e); }
}

async function saveState(){
  localStorage.setItem('pyquestState', JSON.stringify(state));
}

function isLevelUnlocked(id){
  if(id === 1) return true;
  const prevId = id - 1;
  return isLevelDone(prevId);
}

function isLevelDone(id){
  const level = LEVELS[id];
  if(!level) return false;
  return level.challenges.every(ch => state.done[`${id},${level.challenges.indexOf(ch)}`]);
}

function doneCount(){
  return Object.keys(state.done).length;
}

function paintHighlight(code){
  const layer = document.getElementById('highlightLayer');
  if(!layer) return;
  layer.innerHTML = highlightPython(code) + '\n'; // trailing newline keeps scroll height matching textarea
}

const PY_KEYWORDS = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BUILTINS = new Set(['print','len','range','int','float','str','list','dict','set','tuple','sum','max','min','sorted','abs','round','enumerate','zip','map','filter','open','type','isinstance','super','next','iter','bool','input']);

function highlightPython(code){
  // Tokenize character by character, respecting strings/comments, then wrap tokens in spans.
  let out = '';
  let i = 0;
  const n = code.length;
  while(i < n){
    const ch = code[i];

    // comments
    if(ch === '#'){
      let j = i;
      while(j < n && code[j] !== '\n') j++;
      out += `<span class="tok-com">${escapeHtml(code.slice(i,j))}</span>`;
      i = j;
      continue;
    }

    // strings (single, double, triple - simplistic but handles f-strings/prefixes too)
    if(ch === '"' || ch === "'"){
      const quote = ch;
      const triple = code.slice(i, i+3) === quote.repeat(3);
      const qlen = triple ? 3 : 1;
      let j = i + qlen;
      while(j < n){
        if(code[j] === '\\'){ j += 2; continue; }
        if(code.slice(j, j+qlen) === quote.repeat(qlen)){ j += qlen; break; }
        if(!triple && code[j] === '\n'){ break; }
        j++;
      }
      out += `<span class="tok-str">${escapeHtml(code.slice(i,j))}</span>`;
      i = j;
      continue;
    }

    // numbers
    if(/[0-9]/.test(ch)){
      let j = i;
      while(j < n && /[0-9.]/.test(code[j])) j++;
      out += `<span class="tok-num">${escapeHtml(code.slice(i,j))}</span>`;
      i = j;
      continue;
    }

    // identifiers / keywords
    if(/[A-Za-z_]/.test(ch)){
      let j = i;
      while(j < n && /[A-Za-z0-9_]/.test(code[j])) j++;
      const word = code.slice(i,j);
      // check if this identifier is immediately followed by '(' -> function-ish call/def name
      let k = j; while(k < n && code[k] === ' ') k++;
      const followedByParen = code[k] === '(';
      const prevWord = out.match(/([A-Za-z_]\w*)\s*$/); // rough lookback, best-effort only
      if(PY_KEYWORDS.has(word)){
        out += `<span class="tok-kw">${escapeHtml(word)}</span>`;
      } else if(word === 'self' || word === 'cls'){
        out += `<span class="tok-self">${escapeHtml(word)}</span>`;
      } else if(PY_BUILTINS.has(word) && followedByParen){
        out += `<span class="tok-builtin">${escapeHtml(word)}</span>`;
      } else if(followedByParen){
        out += `<span class="tok-def">${escapeHtml(word)}</span>`;
      } else {
        out += escapeHtml(word);
      }
      i = j;
      continue;
    }

    // everything else (whitespace, punctuation, operators)
    out += escapeHtml(ch);
    i++;
  }
  return out;
}

function translateError(rawError){
  const e = rawError || '';
  const rules = [
    { test: /NameError.*?'(\w+)'.*not defined/i, explain: (m) => `Python doesn't know what "${m[1]}" is yet. This usually means either a typo in a variable/function name, or you're using something before you've created it. Check spelling and make sure that line runs before this one.` },
    { test: /IndentationError|unexpected indent|expected an indented block/i, explain: () => `Python cares about spacing. Every line inside a for/if/def/while block needs exactly 4 spaces (or a consistent amount) more than the line that opened it. Mixing tabs and spaces, or forgetting to indent the body, causes this.` },
    { test: /SyntaxError.*?invalid syntax/i, explain: () => `Python couldn't parse this line — often a missing colon (:) at the end of an if/for/def/while line, a missing closing bracket/quote, or a stray character. Check the line just before where it points.` },
    { test: /TypeError.*?unsupported operand/i, explain: () => `You're trying to combine two different types that don't mix directly — e.g. adding a number to text (str + int). Convert one first, like int(x) or str(x).` },
    { test: /ZeroDivisionError/i, explain: () => `You divided by zero somewhere. Check if a variable you're dividing by could be 0, and handle that case (e.g. with try/except or an if check).` },
    { test: /IndexError/i, explain: () => `You tried to access a position in a list that doesn't exist — e.g. asking for the 5th item in a 3-item list. Remember indexing starts at 0.` },
    { test: /KeyError.*?'(\w+)'/i, explain: (m) => `The dictionary doesn't have a key called "${m[1]}". Double check the exact spelling/case of the key you're looking up.` },
    { test: /Test failed: (.*)/i, explain: (m) => `Your code ran without crashing, but the result wasn't quite right: ${m[1]}. Compare what you expected vs. what your code actually produced — try adding a print() to see the value.` },
  ];
  for(const rule of rules){
    const m = e.match(rule.test);
    if(m) return rule.explain(m);
  }
  return null;
}

function getCode(key, starter){ return codeCache[key] !== undefined ? codeCache[key] : starter; }
function setConsole(html){ consoleOut = html; const el=document.getElementById('console'); if(el) el.innerHTML = html; }
function flash(msg){ setConsole(`<span class="sys">${escapeHtml(msg)}</span>`); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateFuncIndicator(code){
  const el = document.getElementById('funcIndicator');
  if(!el) return;
  const lines = code.split('\n');
  const defs = [];
  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(/^(\s*)def\s+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*:\s*$/);
    if(!m) continue;
    const indent = m[1].length;
    const name = m[2];
    const params = m[3].trim();
    // scan the body (more-indented lines) for a return statement
    let hasReturn = false, bodyLines = 0;
    for(let j=i+1;j<lines.length;j++){
      const line = lines[j];
      if(line.trim()==='') continue;
      const lineIndent = line.match(/^\s*/)[0].length;
      if(lineIndent <= indent) break;
      bodyLines++;
      if(/^\s*return\b/.test(line)) hasReturn = true;
    }
    defs.push({name, params, hasReturn, bodyLines});
  }
  if(defs.length===0){ el.innerHTML = ''; return; }
  el.innerHTML = defs.map(d=>{
    const paramLabel = d.params ? d.params : '(no params)';
    const status = d.bodyLines===0
      ? `<span style="color:var(--dim)">— empty body</span>`
      : d.hasReturn
        ? `<span style="color:var(--green)">✓ returns a value</span>`
        : `<span style="color:var(--amber)">△ no return (ok if it only prints)</span>`;
    return `<span style="color:var(--blue)">ƒ ${escapeHtml(d.name)}(${escapeHtml(paramLabel)})</span> ${status}`;
  }).join('<br>');
}

async function runPython(code, tests, setup){
  return new Promise((resolve) => {
    let stdout = "", error = null, ok = false;
    const oldPrint = window.print;
    window.print = (...args) => { stdout += args.join(' ') + '\n'; };
    try {
      Sk.misceval.asyncToPromise(() => {
        return Sk.importMainWithBody("<stdin>", false, setup + code, true);
      }).then(() => {
        if(tests){
          for(const t of tests){
            try {
              Sk.misceval.asyncToPromise(() => {
                return Sk.importMainWithBody("<test>", false, t.check, true);
              }).then(() => {
                // add test check logic here
              });
            } catch(e) {
              error = "Test failed: " + e;
            }
          }
          ok = !error;
        } else {
          ok = true;
        }
        window.print = oldPrint;
        resolve({stdout, error, ok});
      }).catch(e => {
        error = e.toString();
        window.print = oldPrint;
        resolve({stdout, error, ok: false});
      });
    } catch(e) {
      error = e.toString();
      window.print = oldPrint;
      resolve({stdout, error, ok: false});
    }
  });
}
